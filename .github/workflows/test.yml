name: Run Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Code Linting & Unit Tests
    strategy:
      matrix:
        go-version:
          - 1.24.x
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: '0'
      - name: Install Go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495
        with:
          go-version: ${{ matrix.go-version }}
      - name: Linting Code
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=10m0s
      - name: Run Go Tests
        run: go test -v ./...
      - name: Build All Binaries
        run: go build ./...
